<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" width="900" height="450" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1a7f37"/></marker>
  </defs>
  <rect x="0" y="0" width="900" height="450" fill="#ffffff"/>
  <text x="450" y="28" text-anchor="middle" font-size="18" font-weight="700" fill="#24292f">Two ways to serve 10,000 connections</text>

  <!-- left: thread per connection -->
  <rect x="20" y="44" width="420" height="300" rx="12" fill="#fff8f6" stroke="#cf222e"/>
  <text x="38" y="68" font-size="15" font-weight="700" fill="#cf222e">Blocking I/O: a thread per connection</text>
  <g font-size="12">
    <rect x="38" y="84" width="110" height="34" rx="6" fill="#ffffff" stroke="#8c959f"/><text x="93" y="105" text-anchor="middle" fill="#24292f">socket 1</text>
    <rect x="200" y="84" width="220" height="34" rx="6" fill="#ffebe9" stroke="#cf222e"/><text x="310" y="105" text-anchor="middle" fill="#24292f">thread 1 · blocked in read()</text>
    <rect x="38" y="128" width="110" height="34" rx="6" fill="#ffffff" stroke="#8c959f"/><text x="93" y="149" text-anchor="middle" fill="#24292f">socket 2</text>
    <rect x="200" y="128" width="220" height="34" rx="6" fill="#ffebe9" stroke="#cf222e"/><text x="310" y="149" text-anchor="middle" fill="#24292f">thread 2 · blocked in read()</text>
    <rect x="38" y="172" width="110" height="34" rx="6" fill="#ffffff" stroke="#8c959f"/><text x="93" y="193" text-anchor="middle" fill="#24292f">socket 3</text>
    <rect x="200" y="172" width="220" height="34" rx="6" fill="#dafbe1" stroke="#1a7f37"/><text x="310" y="193" text-anchor="middle" fill="#24292f">thread 3 · processing</text>
    <rect x="38" y="216" width="110" height="34" rx="6" fill="#ffffff" stroke="#8c959f"/><text x="93" y="237" text-anchor="middle" fill="#24292f">socket 4</text>
    <rect x="200" y="216" width="220" height="34" rx="6" fill="#ffebe9" stroke="#cf222e"/><text x="310" y="237" text-anchor="middle" fill="#24292f">thread 4 · blocked in read()</text>
    <text x="93" y="274" text-anchor="middle" fill="#57606a">⋮</text><text x="310" y="274" text-anchor="middle" fill="#57606a">⋮</text>
  </g>
  <g stroke="#57606a" stroke-width="1.4">
    <line x1="148" y1="101" x2="197" y2="101" marker-end="url(#a)"/>
    <line x1="148" y1="145" x2="197" y2="145" marker-end="url(#a)"/>
    <line x1="148" y1="189" x2="197" y2="189" marker-end="url(#a)"/>
    <line x1="148" y1="233" x2="197" y2="233" marker-end="url(#a)"/>
  </g>
  <text x="38" y="304" font-size="13" fill="#24292f">10,000 connections → 10,000 OS threads</text>
  <text x="38" y="324" font-size="12" fill="#57606a">~1 MB stack each, context switches, most of them idle</text>

  <!-- right: selector -->
  <rect x="460" y="44" width="420" height="300" rx="12" fill="#f6fff8" stroke="#1a7f37"/>
  <text x="478" y="68" font-size="15" font-weight="700" fill="#1a7f37">NIO: a selector multiplexes many channels</text>
  <g font-size="12">
    <rect x="478" y="84" width="90" height="28" rx="6" fill="#ffffff" stroke="#8c959f"/><text x="523" y="103" text-anchor="middle" fill="#24292f">channel 1</text>
    <rect x="478" y="118" width="90" height="28" rx="6" fill="#dafbe1" stroke="#1a7f37"/><text x="523" y="137" text-anchor="middle" fill="#24292f">ch 2 · ready</text>
    <rect x="478" y="152" width="90" height="28" rx="6" fill="#ffffff" stroke="#8c959f"/><text x="523" y="171" text-anchor="middle" fill="#24292f">channel 3</text>
    <rect x="478" y="186" width="90" height="28" rx="6" fill="#ffffff" stroke="#8c959f"/><text x="523" y="205" text-anchor="middle" fill="#24292f">channel 4</text>
    <rect x="478" y="220" width="90" height="28" rx="6" fill="#dafbe1" stroke="#1a7f37"/><text x="523" y="239" text-anchor="middle" fill="#24292f">ch 5 · ready</text>
    <text x="523" y="270" text-anchor="middle" fill="#57606a">⋮ 10,000</text>
  </g>
  <g stroke="#8c959f" stroke-width="1.2">
    <line x1="568" y1="98" x2="606" y2="160"/><line x1="568" y1="132" x2="606" y2="164"/>
    <line x1="568" y1="166" x2="606" y2="168"/><line x1="568" y1="200" x2="606" y2="172"/>
    <line x1="568" y1="234" x2="606" y2="176"/>
  </g>
  <rect x="606" y="132" width="100" height="74" rx="10" fill="#ffffff" stroke="#1a7f37" stroke-width="1.8"/>
  <text x="656" y="160" text-anchor="middle" font-size="14" font-weight="700" fill="#24292f">Selector</text>
  <text x="656" y="178" text-anchor="middle" font-size="11" fill="#57606a">epoll / kqueue</text>
  <text x="656" y="194" text-anchor="middle" font-size="11" fill="#57606a">select()</text>
  <line x1="706" y1="169" x2="734" y2="169" stroke="#1a7f37" stroke-width="1.8" marker-end="url(#g)"/>
  <rect x="736" y="124" width="128" height="90" rx="10" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.8"/>
  <text x="800" y="148" text-anchor="middle" font-size="13" font-weight="700" fill="#24292f">event-loop</text>
  <text x="800" y="166" text-anchor="middle" font-size="13" font-weight="700" fill="#24292f">thread</text>
  <text x="800" y="186" text-anchor="middle" font-size="11" fill="#57606a">ready: ch2 READ</text>
  <text x="800" y="202" text-anchor="middle" font-size="11" fill="#57606a">ready: ch5 WRITE</text>
  <text x="478" y="304" font-size="13" fill="#24292f">10,000 connections → a few event-loop threads</text>
  <text x="478" y="324" font-size="12" fill="#57606a">Netty, Tomcat NIO connector, Undertow, Vert.x all work this way</text>

  <!-- bottom: VT -->
  <rect x="20" y="360" width="860" height="78" rx="12" fill="#ddf4ff" stroke="#0969da"/>
  <text x="38" y="386" font-size="14" font-weight="700" fill="#0969da">Virtual threads combine both:</text>
  <text x="38" y="408" font-size="13" fill="#24292f">you write blocking, thread-per-connection code (left), while the JDK parks the virtual thread and waits on</text>
  <text x="38" y="428" font-size="13" fill="#24292f">an internal epoll/kqueue poller (right). Readable code with multiplexed I/O underneath.</text>
</svg>
