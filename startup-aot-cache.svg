<text x="754.1" y="156.0" font-size="13" font-weight="600" fill="#24292f">614 ms</text>
<text x="20" y="204.0" font-size="13" font-weight="600" fill="#24292f">JDK 21</text>
<text x="278" y="204.0" text-anchor="end" font-size="13" fill="#24292f">AppCDS archive</text>
