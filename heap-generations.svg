<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#24292f"/></marker>
  </defs>
  <rect x="0" y="0" width="900" height="470" fill="#ffffff"/>
  <text x="450" y="28" text-anchor="middle" font-size="18" font-weight="700" fill="#24292f">Generational heap (Serial / Parallel layout; G1 and generational ZGC use the same idea)</text>

  <!-- heap -->
  <rect x="20" y="46" width="640" height="236" rx="14" fill="#ffffff" stroke="#24292f" stroke-width="1.6"/>
  <text x="36" y="68" font-size="14" font-weight="700" fill="#24292f">Java heap (bounded by -Xmx)</text>

  <rect x="36" y="78" width="300" height="190" rx="10" fill="#f6fff8" stroke="#1a7f37"/>
  <text x="48" y="97" font-size="13" font-weight="700" fill="#1a7f37">Young generation</text>
  <rect x="48" y="106" width="180" height="150" rx="8" fill="#dafbe1" stroke="#1a7f37"/>
  <text x="138" y="170" text-anchor="middle" font-size="16" font-weight="700" fill="#24292f">Eden</text>
  <text x="138" y="190" text-anchor="middle" font-size="12" fill="#57606a">new objects land here</text>
  <text x="138" y="206" text-anchor="middle" font-size="12" fill="#57606a">(bump-pointer in TLABs)</text>
  <rect x="240" y="106" width="86" height="68" rx="8" fill="#fff8c5" stroke="#9a6700"/>
  <text x="283" y="137" text-anchor="middle" font-size="14" font-weight="700" fill="#24292f">S0</text>
  <text x="283" y="156" text-anchor="middle" font-size="11" fill="#57606a">"from"</text>
  <rect x="240" y="188" width="86" height="68" rx="8" fill="#fff8c5" stroke="#9a6700"/>
  <text x="283" y="219" text-anchor="middle" font-size="14" font-weight="700" fill="#24292f">S1</text>
  <text x="283" y="238" text-anchor="middle" font-size="11" fill="#57606a">"to"</text>

  <rect x="352" y="78" width="294" height="190" rx="10" fill="#ffebe9" stroke="#cf222e"/>
  <text x="499" y="150" text-anchor="middle" font-size="16" font-weight="700" fill="#24292f">Old generation</text>
  <text x="499" y="172" text-anchor="middle" font-size="12" fill="#57606a">objects that survived several minor GCs</text>
  <text x="499" y="190" text-anchor="middle" font-size="12" fill="#57606a">collected by major / mixed / full GC</text>
  <text x="499" y="208" text-anchor="middle" font-size="12" fill="#57606a">(much less often, much more expensive)</text>

  <!-- arrows -->
  <path d="M228,222 L238,222" fill="none" stroke="#24292f" stroke-width="1.6" marker-end="url(#a)"/>
  <path d="M326,140 C344,150 344,205 328,214" fill="none" stroke="#24292f" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="326" y1="244" x2="350" y2="244" stroke="#24292f" stroke-width="1.6" marker-end="url(#a)"/>

  <!-- metaspace -->
  <rect x="680" y="46" width="200" height="236" rx="14" fill="#f6f8fa" stroke="#8c959f" stroke-dasharray="6 4"/>
  <text x="780" y="140" text-anchor="middle" font-size="16" font-weight="700" fill="#24292f">Metaspace</text>
  <text x="780" y="162" text-anchor="middle" font-size="12" fill="#57606a">class metadata</text>
  <text x="780" y="180" text-anchor="middle" font-size="12" fill="#57606a">native memory,</text>
  <text x="780" y="198" text-anchor="middle" font-size="12" fill="#57606a">NOT part of -Xmx</text>
  <text x="780" y="216" text-anchor="middle" font-size="12" fill="#57606a">(replaced PermGen in Java 8)</text>

  <!-- steps -->
  <g font-size="13" fill="#24292f">
    <text x="30" y="306"><tspan font-weight="700">① Minor GC</tspan><tspan dx="6">(stop-the-world): copy live objects from Eden + S0 into S1, age += 1. Then S0 and S1 swap roles.</tspan></text>
    <text x="30" y="326"><tspan font-weight="700">② Promotion</tspan><tspan dx="6">to Old when age &gt; tenuring threshold (≤ 15), or straight away if the survivor space overflows ("premature promotion").</tspan></text>
    <text x="30" y="346"><tspan font-weight="700">③ Cost</tspan><tspan dx="6">of a copying minor GC ∝ number of SURVIVORS, not garbage. Dead objects cost nothing to collect.</tspan></text>
  </g>

  <!-- hypothesis chart -->
  <text x="30" y="380" font-size="13" font-weight="700" fill="#24292f">Weak generational hypothesis: most objects die young</text>
  <line x1="40" y1="460" x2="440" y2="460" stroke="#57606a"/>
  <line x1="40" y1="388" x2="40" y2="460" stroke="#57606a"/>
  <g fill="#1a7f37">
    <rect x="50" y="392" width="30" height="68"/>
    <rect x="88" y="436" width="30" height="24"/>
    <rect x="126" y="447" width="30" height="13"/>
    <rect x="164" y="452" width="30" height="8"/>
    <rect x="202" y="454" width="30" height="6"/>
  </g>
  <g fill="#cf222e">
    <rect x="240" y="455" width="30" height="5"/>
    <rect x="278" y="455" width="30" height="5"/>
    <rect x="316" y="455" width="30" height="5"/>
    <rect x="354" y="455" width="30" height="5"/>
    <rect x="392" y="455" width="30" height="5"/>
  </g>
  <text x="460" y="420" font-size="12" fill="#57606a">x: object age (GCs survived) · y: objects still alive</text>
  <text x="460" y="438" font-size="12" fill="#57606a">Green: died in the young gen, almost free. Red: the long-lived</text>
  <text x="460" y="456" font-size="12" fill="#57606a">minority (caches, sessions, singletons) that ends up in Old.</text>
</svg>
