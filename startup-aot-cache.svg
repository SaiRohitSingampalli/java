<line x1="735.7" y1="78" x2="735.7" y2="384" stroke="#d0d7de" stroke-width="1"/>
<text x="735.7" y="402" text-anchor="middle" font-size="11" fill="#57606a">600 ms</text>
<line x1="810.0" y1="78" x2="810.0" y2="384" stroke="#d0d7de" stroke-width="1"/>
<text x="810.0" y="402" text-anchor="middle" font-size="11" fill="#57606a">700 ms</text>
