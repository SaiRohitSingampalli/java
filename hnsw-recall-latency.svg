<title id="t">HNSW recall@10 against time per query</title>
<desc id="d">efSearch 10: recall 0.846 in 41 µs; 20: 0.956 in 48 µs; 40: 0.995 in 66 µs; 80: 1.000 in 109 µs; 160: 1.000 in 148 µs; 320: 1.000 in 309 µs. Exact brute force: 1.000 in 2,761 µs.</desc>
