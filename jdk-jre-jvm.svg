<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" width="900" height="540" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="900" height="540" fill="#ffffff"/>

  <!-- JDK -->
  <rect x="20" y="16" width="860" height="448" rx="18" fill="#ddf4ff" stroke="#0969da" stroke-width="2.5"/>
  <text x="44" y="54" font-size="26" font-weight="700" fill="#0969da">JDK</text>
  <text x="106" y="53" font-size="15" fill="#24292f">Java Development Kit: build, package, run, diagnose</text>

  <!-- JRE -->
  <rect x="40" y="72" width="588" height="376" rx="14" fill="#fbefff" stroke="#8250df" stroke-width="2.2"/>
  <text x="60" y="104" font-size="22" font-weight="700" fill="#8250df">JRE</text>
  <text x="112" y="103" font-size="14" fill="#24292f">Java Runtime Environment: JVM + class libraries</text>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#24292f">
    <rect x="60" y="120" width="96" height="28" rx="14" fill="#ffffff" stroke="#8250df"/>
    <text x="108" y="139" text-anchor="middle">java.base</text>
    <rect x="164" y="120" width="86" height="28" rx="14" fill="#ffffff" stroke="#8250df"/>
    <text x="207" y="139" text-anchor="middle">java.sql</text>
    <rect x="258" y="120" width="120" height="28" rx="14" fill="#ffffff" stroke="#8250df"/>
    <text x="318" y="139" text-anchor="middle">java.net.http</text>
    <rect x="386" y="120" width="86" height="28" rx="14" fill="#ffffff" stroke="#8250df"/>
    <text x="429" y="139" text-anchor="middle">java.xml</text>
    <rect x="480" y="120" width="120" height="28" rx="14" fill="#ffffff" stroke="#8250df"/>
    <text x="540" y="139" text-anchor="middle">java.logging</text>
    <rect x="60" y="156" width="120" height="28" rx="14" fill="#ffffff" stroke="#8250df"/>
    <text x="120" y="175" text-anchor="middle">java.desktop</text>
    <rect x="188" y="156" width="82" height="28" rx="14" fill="#ffffff" stroke="#8250df"/>
    <text x="229" y="175" text-anchor="middle">jdk.jfr</text>
    <rect x="278" y="156" width="150" height="28" rx="14" fill="#ffffff" stroke="#8250df"/>
    <text x="353" y="175" text-anchor="middle">java.management</text>
  </g>
  <text x="440" y="175" font-size="13" fill="#57606a">+ ~60 more modules</text>

  <!-- JVM -->
  <rect x="60" y="198" width="548" height="234" rx="12" fill="#dafbe1" stroke="#1a7f37" stroke-width="2.2"/>
  <text x="80" y="230" font-size="22" font-weight="700" fill="#1a7f37">JVM</text>
  <text x="134" y="229" font-size="14" fill="#24292f">Java Virtual Machine: executes bytecode</text>

  <g font-size="13">
    <!-- row 1 -->
    <rect x="80" y="246" width="118" height="70" rx="8" fill="#ffffff" stroke="#1a7f37"/>
    <text x="139" y="274" text-anchor="middle" font-weight="700" fill="#24292f">Class Loader</text>
    <text x="139" y="294" text-anchor="middle" font-size="12" fill="#57606a">load · link · init</text>

    <rect x="210" y="246" width="118" height="70" rx="8" fill="#ffffff" stroke="#1a7f37"/>
    <text x="269" y="274" text-anchor="middle" font-weight="700" fill="#24292f">Verifier</text>
    <text x="269" y="294" text-anchor="middle" font-size="12" fill="#57606a">type safety</text>

    <rect x="340" y="246" width="118" height="70" rx="8" fill="#ffffff" stroke="#1a7f37"/>
    <text x="399" y="274" text-anchor="middle" font-weight="700" fill="#24292f">Interpreter</text>
    <text x="399" y="294" text-anchor="middle" font-size="12" fill="#57606a">template-based</text>

    <rect x="470" y="246" width="118" height="70" rx="8" fill="#ffffff" stroke="#1a7f37"/>
    <text x="529" y="274" text-anchor="middle" font-weight="700" fill="#24292f">JIT</text>
    <text x="529" y="294" text-anchor="middle" font-size="12" fill="#57606a">C1 + C2 tiered</text>

    <!-- row 2 -->
    <rect x="80" y="330" width="118" height="70" rx="8" fill="#ffffff" stroke="#1a7f37"/>
    <text x="139" y="358" text-anchor="middle" font-weight="700" fill="#24292f">Heap + GC</text>
    <text x="139" y="378" text-anchor="middle" font-size="12" fill="#57606a">G1 · ZGC · …</text>

    <rect x="210" y="330" width="118" height="70" rx="8" fill="#ffffff" stroke="#1a7f37"/>
    <text x="269" y="358" text-anchor="middle" font-weight="700" fill="#24292f">Metaspace</text>
    <text x="269" y="378" text-anchor="middle" font-size="12" fill="#57606a">class metadata</text>

    <rect x="340" y="330" width="118" height="70" rx="8" fill="#ffffff" stroke="#1a7f37"/>
    <text x="399" y="358" text-anchor="middle" font-weight="700" fill="#24292f">Threads</text>
    <text x="399" y="378" text-anchor="middle" font-size="12" fill="#57606a">stacks · monitors</text>

    <rect x="470" y="330" width="118" height="70" rx="8" fill="#ffffff" stroke="#1a7f37"/>
    <text x="529" y="358" text-anchor="middle" font-weight="700" fill="#24292f">Native</text>
    <text x="529" y="378" text-anchor="middle" font-size="12" fill="#57606a">JNI · FFM API</text>
  </g>

  <!-- Tools panel -->
  <rect x="644" y="72" width="220" height="376" rx="12" fill="#ffffff" stroke="#0969da" stroke-width="1.8"/>
  <text x="664" y="104" font-size="18" font-weight="700" fill="#0969da">Dev tools</text>
  <g font-size="14">
    <text x="664" y="138"><tspan font-family="ui-monospace, Menlo, Consolas, monospace" font-weight="700" fill="#0969da">javac</tspan><tspan dx="8" fill="#57606a">compiler</tspan></text>
    <text x="664" y="168"><tspan font-family="ui-monospace, Menlo, Consolas, monospace" font-weight="700" fill="#0969da">javap</tspan><tspan dx="8" fill="#57606a">disassembler</tspan></text>
    <text x="664" y="198"><tspan font-family="ui-monospace, Menlo, Consolas, monospace" font-weight="700" fill="#0969da">jar</tspan><tspan dx="8" fill="#57606a">packaging</tspan></text>
    <text x="664" y="228"><tspan font-family="ui-monospace, Menlo, Consolas, monospace" font-weight="700" fill="#0969da">jlink</tspan><tspan dx="8" fill="#57606a">custom runtime</tspan></text>
    <text x="664" y="258"><tspan font-family="ui-monospace, Menlo, Consolas, monospace" font-weight="700" fill="#0969da">jshell</tspan><tspan dx="8" fill="#57606a">REPL</tspan></text>
    <text x="664" y="288"><tspan font-family="ui-monospace, Menlo, Consolas, monospace" font-weight="700" fill="#0969da">jcmd</tspan><tspan dx="8" fill="#57606a">diagnostics</tspan></text>
    <text x="664" y="318"><tspan font-family="ui-monospace, Menlo, Consolas, monospace" font-weight="700" fill="#0969da">jfr</tspan><tspan dx="8" fill="#57606a">flight recorder</tspan></text>
    <text x="664" y="348"><tspan font-family="ui-monospace, Menlo, Consolas, monospace" font-weight="700" fill="#0969da">jdeps</tspan><tspan dx="8" fill="#57606a">dependencies</tspan></text>
    <text x="664" y="378"><tspan font-family="ui-monospace, Menlo, Consolas, monospace" font-weight="700" fill="#0969da">jpackage</tspan><tspan dx="8" fill="#57606a">installers</tspan></text>
    <text x="664" y="408"><tspan font-family="ui-monospace, Menlo, Consolas, monospace" font-weight="700" fill="#0969da">javadoc</tspan><tspan dx="8" fill="#57606a">API docs</tspan></text>
  </g>

  <!-- OS -->
  <rect x="20" y="478" width="860" height="46" rx="10" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/>
  <text x="450" y="507" text-anchor="middle" font-size="15" fill="#24292f"><tspan font-weight="700">Operating system + CPU</tspan><tspan dx="8" fill="#57606a"> ·   Linux · Windows · macOS   ·   x64 · AArch64 · RISC-V</tspan></text>
</svg>
