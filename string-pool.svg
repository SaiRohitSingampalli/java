<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="900" height="500" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0969da"/></marker>
    <marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8250df"/></marker>
    <marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#bc4c00"/></marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker>
  </defs>
  <rect x="0" y="0" width="900" height="500" fill="#ffffff"/>

  <!-- Stack -->
  <rect x="20" y="40" width="250" height="362" rx="12" fill="#f6f8fa" stroke="#57606a" stroke-width="1.6"/>
  <text x="36" y="66" font-size="16" font-weight="700" fill="#24292f">Stack: main() frame</text>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#24292f">
    <rect x="35" y="80" width="220" height="34" rx="6" fill="#ffffff" stroke="#8c959f"/>
    <text x="47" y="102"><tspan font-weight="700">a</tspan><tspan dx="10">"hello"</tspan></text>
    <rect x="35" y="125" width="220" height="34" rx="6" fill="#ffffff" stroke="#8c959f"/>
    <text x="47" y="147"><tspan font-weight="700">b</tspan><tspan dx="10">"hello"</tspan></text>
    <rect x="35" y="170" width="220" height="34" rx="6" fill="#ffffff" stroke="#8250df"/>
    <text x="47" y="192"><tspan font-weight="700">c</tspan><tspan dx="10">new String("hello")</tspan></text>
    <rect x="35" y="215" width="220" height="34" rx="6" fill="#ffffff" stroke="#8c959f"/>
    <text x="47" y="237"><tspan font-weight="700">d</tspan><tspan dx="10">"hel" + "lo"</tspan></text>
    <rect x="35" y="260" width="220" height="34" rx="6" fill="#ffffff" stroke="#bc4c00"/>
    <text x="47" y="282"><tspan font-weight="700">e</tspan><tspan dx="10">part + "lo"</tspan></text>
    <rect x="35" y="305" width="220" height="34" rx="6" fill="#ffffff" stroke="#8c959f"/>
    <text x="47" y="327"><tspan font-weight="700">f</tspan><tspan dx="10">FINAL_PART + "lo"</tspan></text>
    <rect x="35" y="350" width="220" height="34" rx="6" fill="#ffffff" stroke="#8c959f"/>
    <text x="47" y="372"><tspan font-weight="700">g</tspan><tspan dx="10">c.intern()</tspan></text>
  </g>

  <!-- Heap -->
  <rect x="300" y="20" width="580" height="400" rx="14" fill="#ffffff" stroke="#24292f" stroke-width="1.6"/>
  <text x="318" y="46" font-size="16" font-weight="700" fill="#24292f">Heap</text>

  <!-- String table -->
  <rect x="320" y="60" width="280" height="140" rx="10" fill="#fff8c5" stroke="#9a6700" stroke-width="1.4" stroke-dasharray="6 4"/>
  <text x="334" y="82" font-size="13" font-weight="700" fill="#9a6700">String table (interned strings)</text>
  <rect x="340" y="96" width="240" height="88" rx="8" fill="#ddf4ff" stroke="#0969da" stroke-width="1.6"/>
  <text x="352" y="118" font-size="14" font-weight="700" fill="#0969da">String #1  (the literal)</text>
  <text x="352" y="140" font-size="12" fill="#24292f">value → byte[] · coder = LATIN1</text>
  <text x="352" y="160" font-size="12" fill="#24292f">hash cached after first hashCode()</text>
  <text x="352" y="176" font-size="11" fill="#57606a">shared by every "hello" literal in the JVM</text>

  <rect x="660" y="112" width="200" height="56" rx="8" fill="#f6f8fa" stroke="#57606a"/>
  <text x="760" y="134" text-anchor="middle" font-size="13" font-weight="700" fill="#24292f">byte[5]</text>
  <text x="760" y="155" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#24292f">h e l l o</text>

  <rect x="340" y="240" width="240" height="70" rx="8" fill="#fbefff" stroke="#8250df" stroke-width="1.6"/>
  <text x="352" y="264" font-size="14" font-weight="700" fill="#8250df">String #2  new String(...)</text>
  <text x="352" y="286" font-size="12" fill="#24292f">a distinct object, but it SHARES</text>
  <text x="352" y="302" font-size="12" fill="#24292f">the literal's byte[] (no copy)</text>

  <rect x="340" y="340" width="240" height="70" rx="8" fill="#fff1e5" stroke="#bc4c00" stroke-width="1.6"/>
  <text x="352" y="364" font-size="14" font-weight="700" fill="#bc4c00">String #3  runtime concat</text>
  <text x="352" y="386" font-size="12" fill="#24292f">built by StringConcatFactory</text>
  <text x="352" y="402" font-size="12" fill="#24292f">fresh object + fresh byte[]</text>

  <rect x="660" y="348" width="200" height="56" rx="8" fill="#f6f8fa" stroke="#57606a"/>
  <text x="760" y="370" text-anchor="middle" font-size="13" font-weight="700" fill="#24292f">byte[5]</text>
  <text x="760" y="391" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#24292f">h e l l o</text>

  <!-- arrows: stack → heap -->
  <g stroke-width="1.6" fill="none">
    <line x1="255" y1="97"  x2="338" y2="116" stroke="#0969da" marker-end="url(#ab)"/>
    <line x1="255" y1="142" x2="338" y2="128" stroke="#0969da" marker-end="url(#ab)"/>
    <line x1="255" y1="187" x2="338" y2="262" stroke="#8250df" marker-end="url(#ap)"/>
    <line x1="255" y1="232" x2="338" y2="142" stroke="#0969da" marker-end="url(#ab)"/>
    <line x1="255" y1="277" x2="338" y2="366" stroke="#bc4c00" marker-end="url(#ao)"/>
    <line x1="255" y1="322" x2="338" y2="156" stroke="#0969da" marker-end="url(#ab)"/>
    <line x1="255" y1="367" x2="338" y2="170" stroke="#0969da" marker-end="url(#ab)"/>
    <!-- heap internal -->
    <line x1="580" y1="138" x2="658" y2="138" stroke="#57606a" marker-end="url(#ag)"/>
    <path d="M580,272 C620,272 620,166 658,160" stroke="#8250df" stroke-dasharray="5 4" marker-end="url(#ap)"/>
    <line x1="580" y1="376" x2="658" y2="376" stroke="#57606a" marker-end="url(#ag)"/>
  </g>

  <!-- legend -->
  <rect x="20" y="436" width="860" height="50" rx="10" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="450" y="457" text-anchor="middle" font-size="14" fill="#24292f"><tspan font-weight="700">==</tspan><tspan dx="6">compares the arrows:</tspan><tspan dx="6" font-family="ui-monospace, Menlo, Consolas, monospace">a == b == d == f == g</tspan><tspan dx="8">but</tspan><tspan dx="6" font-family="ui-monospace, Menlo, Consolas, monospace">a != c</tspan><tspan dx="6">and</tspan><tspan dx="6" font-family="ui-monospace, Menlo, Consolas, monospace">a != e</tspan></text>
  <text x="450" y="477" text-anchor="middle" font-size="13" fill="#57606a"><tspan font-weight="700" fill="#24292f">equals()</tspan><tspan dx="6">compares the bytes, so all seven are equal. FINAL_PART is a constant variable, so javac folds f at compile time.</tspan></text>
</svg>
