<text x="802.4" y="252.0" font-size="13" font-weight="600" fill="#24292f">679 ms</text>
<text x="20" y="300.0" font-size="13" font-weight="600" fill="#24292f">JDK 25</text>
<text x="278" y="300.0" text-anchor="end" font-size="13" fill="#24292f">default CDS (JDK classes)</text>
